name: UI

# The React UI for 1.0 (branch family v1*). A no-op until ui/package.json exists.
on:
  push:
    branches: ['v1**']
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/ui.yml'

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    # Linux: the UI is plain web code and tested in a browser; the Windows build is covered by Rust and Release.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hashFiles() only works inside steps, so one step decides and the others check its answer.
      - id: gate
        working-directory: .
        run: echo "go=${{ hashFiles('ui/package.json') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # latest LTS (26 becomes LTS on 2026-10-28)
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - if: steps.gate.outputs.go == 'true'
        run: npm run lint
      - if: steps.gate.outputs.go == 'true'
        run: npm run typecheck
      - if: steps.gate.outputs.go == 'true'
        run: npx vitest run
      - if: steps.gate.outputs.go == 'true'
        run: npm run build
      - if: steps.gate.outputs.go == 'true'
        run: npx playwright install --with-deps chromium
      # playwright.config.ts starts `vite preview` itself (webServer), so e2e runs against the built UI.
      - if: steps.gate.outputs.go == 'true'
        run: npx playwright test
      - if: failure() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7
