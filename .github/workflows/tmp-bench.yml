name: tmp-bench
on:
  push:
    branches: ['v1-release']
permissions:
  contents: read
jobs:
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo clippy -p declutter-core --benches --locked -- -D warnings
      - run: cargo bench -p declutter-core --no-run --locked
