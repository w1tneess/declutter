name: Release v1

# Real releases come ONLY from a v1.* tag push. workflow_dispatch is a dry run: it builds everything and uploads
# workflow artifacts, but the publish job below is skipped, signing is skipped and nothing is attested.
# The Python app's releases (tags v0.*) are release.yml; the two tag filters must never overlap.
on:
  push:
    tags: ['v1.*']
  workflow_dispatch:

# Nothing gets more than read access by default; only the publish job asks for more.
permissions:
  contents: read

concurrency:
  group: release-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      # No dependency caches: a release is built from scratch so a poisoned cache cannot reach it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # latest LTS (26 becomes LTS on 2026-10-28)

      - name: Version (a tag must match the workspace version)
        run: |
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          [ -n "$version" ] || { echo "no version in Cargo.toml"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: UI build
        working-directory: ui
        run: |
          npm ci
          npm run build

      # Two steps (build, then bundle) so the app exe can be signed before it is packed into the installer.
      # Assumes @tauri-apps/cli is a devDependency of ui/ and src-tauri/ sits beside it.
      - name: Build the app
        working-directory: ui
        run: npx --no-install tauri build --no-bundle

      - name: Locate the app exe
        run: |
          exes=(target/release/*.exe)
          [ "${#exes[@]}" -eq 1 ] || { echo "expected one exe in target/release, found: ${exes[*]}"; exit 1; }
          echo "APP_EXE=$(cygpath -w "$(realpath "${exes[0]}")")" >> "$GITHUB_ENV"

      # Signing only on a real release tag and only when SIGNING_PROVIDER=azure is set as a repository variable
      # (docs/DISTRIBUTION.md). Credentials are passed to this one step only.
      - name: Sign the app exe
        if: github.event_name == 'push' && vars.SIGNING_PROVIDER == 'azure'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ env.APP_EXE }}

      # Per-user NSIS installer (no admin rights, no UAC), forced here in case tauri.conf.json says otherwise.
      - name: Bundle the NSIS installer
        working-directory: ui
        run: |
          echo '{"bundle":{"windows":{"nsis":{"installMode":"currentUser"}}}}' > "$RUNNER_TEMP/nsis-user.json"
          npx --no-install tauri bundle --bundles nsis --config "$RUNNER_TEMP/nsis-user.json"

      - name: Locate the installer
        run: |
          installers=(target/release/bundle/nsis/*-setup.exe)
          [ "${#installers[@]}" -eq 1 ] || { echo "expected one installer, found: ${installers[*]}"; exit 1; }
          echo "INSTALLER=$(cygpath -w "$(realpath "${installers[0]}")")" >> "$GITHUB_ENV"

      - name: Sign the installer
        if: github.event_name == 'push' && vars.SIGNING_PROVIDER == 'azure'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ env.INSTALLER }}

      - name: Check the signatures
        if: github.event_name == 'push' && vars.SIGNING_PROVIDER == 'azure'
        shell: pwsh
        run: |
          foreach ($f in $env:APP_EXE, $env:INSTALLER) {
            $s = (Get-AuthenticodeSignature $f).Status
            if ($s -ne 'Valid') { throw "$f is not validly signed: $s" }
          }

      - name: Portable zip, checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $env:INSTALLER dist
          Compress-Archive -Path $env:APP_EXE -DestinationPath "dist\Declutter_$($env:VERSION)_x64-portable.zip"
          # sha256sum format, LF endings, so the publish job (Linux) can check it with `sha256sum --check`.
          $lines = Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    # Tag push only (the trigger allows nothing else): the dry run never gets a write token.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # Runs no code from the build, only the pinned actions below and gh/sha256sum on the files it produced.
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Files must match their checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*-setup.exe
            release/*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v1.0.0-rc.1) is a pre-release.
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" release/*-setup.exe release/*.zip release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Declutter $GITHUB_REF_NAME" --generate-notes $pre
