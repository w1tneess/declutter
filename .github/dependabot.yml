version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # 1.0 (Rust core, Tauri shell, React UI). The ui/ entry reports "not found" until that folder exists.
