name: Release v1

# Real releases come ONLY from a v1.* tag push. A push to branch v1-dryrun (or workflow_dispatch) is a dry run: it builds everything and uploads
# workflow artifacts, but signing, attestation and publishing are skipped.
# The Python app's releases (tags v0.*) are release.yml; the two tag filters must never overlap.
#
# Pipeline: build -> [sign-app] -> bundle -> [sign-installer] -> checksums -> [publish]. Signing happens in jobs of
# their own that run only pinned actions (no npm, no cargo), so no dependency or build script ever runs in a job
# that can obtain the signing token. The signing jobs are skipped unless the repository variable SIGNING_PROVIDER is
# "signpath" (SignPath Foundation, docs/DISTRIBUTION.md); without it a tag still builds and publishes, unsigned.
on:
  push:
    tags: ['v1.*']
    branches: ['v1-dryrun'] # dry run: every signing and publish job is gated on a v1.* tag ref
  workflow_dispatch:

# Nothing gets more than read access by default; the jobs that need more ask for exactly that.
permissions:
  contents: read

concurrency:
  group: release-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      app-exe-id: ${{ steps.upload-app-exe.outputs.artifact-id }} # SignPath fetches the unsigned exe by this id
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      # No dependency caches: a release is built from scratch so a poisoned cache cannot reach it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # latest LTS (26 becomes LTS on 2026-10-28)

      - name: Version (a tag must match the workspace version)
        id: version
        run: |
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          [ -n "$version" ] || { echo "no version in Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # --ignore-scripts: dependency install scripts do not run. If the UI ever needs one, allow that one
      # explicitly rather than dropping the flag.
      - name: UI build
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build

      # Two steps (build, then bundle in another job) so the app exe can be signed before it is packed.
      # The CLI is a devDependency of ui/; it is run from the repo root because it looks for tauri.conf.json in subfolders.
      - name: Build the app
        run: ui/node_modules/.bin/tauri build --no-bundle

      - name: Collect the app exe
        run: |
          exes=(target/release/*.exe)
          [ "${#exes[@]}" -eq 1 ] || { echo "expected one exe in target/release, found: ${exes[*]}"; exit 1; }
          mkdir app-exe
          cp "${exes[0]}" app-exe/

      - id: upload-app-exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-exe
          path: app-exe/*.exe
          if-no-files-found: error
          retention-days: 7

  sign-app:
    # Skipped (not failed) on a dry run or when no signing provider is configured.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.') && vars.SIGNING_PROVIDER == 'signpath'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 70 # includes the wait for the manual approval in SignPath
    # Protected environment: required reviewers and a v1.* tag rule are set in the repository settings. It alone holds
    # the SignPath API token (secret) and the SignPath ids (variables) (docs/DISTRIBUTION.md).
    environment: release-signing
    permissions:
      actions: read # the connector reads this run's jobs and downloads the unsigned artifact
      contents: read
    steps:
      - uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.app-exe-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      # SignPath Foundation's certificate is issued to the Foundation, so that is the subject to expect.
      - name: Check the signature
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem signed -Filter *.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed: $($sig.Status)" }
            $subject = $sig.SignerCertificate.Subject
            if ($subject -notmatch '(^|, )CN=SignPath Foundation(,|$)') { throw "$($f.Name) is signed by '$subject', not SignPath Foundation" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-exe
          path: signed/*.exe
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  bundle:
    # Runs whether sign-app ran or was skipped, but not after a failure.
    if: ${{ !failure() && !cancelled() }}
    needs: [build, sign-app]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      installer-setup-id: ${{ steps.upload-installer-setup.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tauri CLI
        working-directory: ui
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-exe
          path: target/release

      # Per-user NSIS installer (no admin rights, no UAC), forced here in case tauri.conf.json says otherwise.
      - name: Bundle the NSIS installer
        run: |
          echo '{"bundle":{"windows":{"nsis":{"installMode":"currentUser"}}}}' > "$RUNNER_TEMP/nsis-user.json"
          ui/node_modules/.bin/tauri bundle --bundles nsis --config "$RUNNER_TEMP/nsis-user.json"

      - name: Installer and portable zip
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          installers=(target/release/bundle/nsis/*-setup.exe)
          exes=(target/release/*.exe)
          [ "${#installers[@]}" -eq 1 ] || { echo "expected one installer, found: ${installers[*]}"; exit 1; }
          [ "${#exes[@]}" -eq 1 ] || { echo "expected one exe, found: ${exes[*]}"; exit 1; }
          mkdir installer
          cp "${installers[0]}" installer/
          powershell -NoProfile -Command "Compress-Archive -Path '${exes[0]}' -DestinationPath 'installer/Declutter_${VERSION}_x64-portable.zip'"
          ls -l installer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: installer/*
          if-no-files-found: error
          retention-days: 7

      # The setup exe alone, for SignPath: its artifact configuration then matches one exe in both signing requests,
      # and the portable zip (whose exe sign-app already signed) is not sent.
      - id: upload-installer-setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-setup
          path: installer/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  sign-installer:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.') && vars.SIGNING_PROVIDER == 'signpath'
    needs: bundle
    runs-on: windows-latest
    timeout-minutes: 70
    environment: release-signing
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: release
      - uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.bundle.outputs.installer-setup-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      # The zip is not signed itself; the exe inside it was signed in sign-app. Swap in the signed setup exe.
      - name: Replace the unsigned installer
        shell: pwsh
        run: Copy-Item signed/*-setup.exe release/ -Force
      # SignPath Foundation's certificate is issued to the Foundation, so that is the subject to expect.
      - name: Check the signature
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem release -Filter *.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed: $($sig.Status)" }
            $subject = $sig.SignerCertificate.Subject
            if ($subject -notmatch '(^|, )CN=SignPath Foundation(,|$)') { throw "$($f.Name) is signed by '$subject', not SignPath Foundation" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: release/*
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  checksums:
    if: ${{ !failure() && !cancelled() }}
    needs: [bundle, sign-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: release
      - name: SHA-256 checksums
        working-directory: release
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    # A v1.* tag push only, whatever the triggers above become: no branch push and no dry run gets a write token.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')
    needs: checksums
    runs-on: ubuntu-latest
    # Runs no code from the build, only the pinned actions below and gh/sha256sum on the files it produced.
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Files must match their checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*-setup.exe
            release/*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v1.0.0-rc.1) is a pre-release.
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" release/*-setup.exe release/*.zip release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Declutter $GITHUB_REF_NAME" --generate-notes $pre
