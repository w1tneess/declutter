[package]
name = "declutter-core"
description = "Declutter core: scanning, planning and the safe actions (Recycle Bin, undoable sort)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
csv = "1.4.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff", "ico"] }
image_hasher = "3.1.1"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
trash = "5.2.9"
ts-rs = "12.0.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_Ioctl", "Win32_Security", "Win32_System_IO"] }
zip = "9.0.5"

[dev-dependencies]
# Text output only (no plotters/rayon pulled in): numbers matter here, not HTML reports. Owner: release.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"

# Performance harness, see docs/PERF.md. Owner: release.
[[bench]]
name = "walk"
harness = false

[[bench]]
name = "dupes"
harness = false
