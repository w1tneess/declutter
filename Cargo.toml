[workspace]
resolver = "2"
members = ["crates/declutter-core", "crates/declutter-app", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/w1tneess/declutter"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
